  # About
  about:
    enable: true
    title: "About me"
    content: |
     I’m a curious fullstack software engineer passionate about building cross-platform fullstack applications with modern technologies.

      After starting my career in law and 2.5 years working at an international audit firm, I pivoted to software engineering to build tools that make a practical difference.

      I gained valuable experience as a software engineer working for a SaaS platform for small businesses. There, I discovered my strengths in 
      designing, managing, and implementing features and projects, and an intense drive to maintain quality and ownership.

      I am British, but I am permanently residing in in Rio de Janeiro, Brazil.
    
    skills:
      enable: true
      title: "These are some of the key technologies I have used:"
      items:
          - "Supabase"
          - "TypeScript"
          - "Flutter"
          - "Claude Code"
          - "Go"
          - "React/Next.js"
          - "Node"
          - "Flutter"
          - "Postgres/SQLite"
          - "Gitlab"

  # Experience
  experience:
    enable: true
    items: 
      - job: "Fullstack Software Engineer"
        company: "Olly Olly Inc"
        date: "August 2025 - Current"
        content: |
          I support development of Olly Olly’s core cross-platform app offerings. I regularly create and design documents and spikes, and I strongly advocate for best practices.

          I regularly develop with Flutter, Supabase, Vue, and other technologies.

          I am a strong contributor across all areas of the engineering team’s workflows, with a core focus on tracing and implementing performance optimisations and automations.

          Notable recent projects that demonstrate my commitment to quality include creating Instagram OAuth access token refresh flows, social media feature memory leak detection and performance improvements, and database maintenance and security enhancements.

      - job: "React Developer"
        company: "Tulfa Inc"
        date: "December 2024 - February 2025"
        content: |
          I lead the development of the company’s portfolio page, which they were migrating from Next.js.

          I created a dynamic, cross-platform, and responsive front-end portfolio page and worked closely with the UX team and Figma to design intuitive, visually appealing interfaces.

          I also integrated React-Motion for animations and Three.js for user-manipulatable 3D objects.

      - job: "Career Break"
        company: Career Break
        date: "August 2023 - December 2024"
        content: |
          I decided to take a career break to focus on building my web development skills. I dedicated myself to learning and
          applying new technologies through personal projects.

          During this time, I worked on projects using React, the Chrome Browser API, MySQL, Go, and other technologies.
      
      - job: "Corporate Intelligence Analyst"
        company: Grant Thornton UK
        date: "February 2021 - August 2023"
        content: |
          I supported the in-house Corporate Intelligence team's operations, by conducting small-scale desktop asset tracing investigations, and assisting with large cross-border asset tracing investigations.

          I developed a sound understanding of open-source intelligence methodologies and resources.
          
          I challenged myself by learning Python and developed several scripts and small tools to boost productivity.
  
